name: Build and Release Kivy Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kivy_android/**"
      - ".github/workflows/kivy-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kivy_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging preflight
        run: python scripts/preflight.py
      - name: Run semantic tests
        run: python -m unittest discover -s tests -v

  build-apk:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kivy_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint build-essential ccache cmake gettext git \
            libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libssl-dev libtool openjdk-17-jdk patch pkg-config \
            python3-dev python3-virtualenv unzip zip zlib1g-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5,<2" "cython<3"
      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug
      - name: Prepare versioned release assets
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' buildozer.spec | head -n 1 | tr -d '[:space:]')"
          test -n "$VERSION"
          TAG="v${VERSION}"
          SOURCE_APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$SOURCE_APK"

          RELEASE_APK="bin/PyBlocks-Studio-${TAG}-debug.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          (
            cd "$(dirname "$RELEASE_APK")"
            sha256sum "$(basename "$RELEASE_APK")"
          ) > "${RELEASE_APK}.sha256"

          {
            printf '## PyBlocks Studio %s\n\n' "$TAG"
            printf '%s\n\n' 'Initial Android package of the native Kivy visual Python programming environment.'
            printf '%s\n' '- Package: org.jerrecode.pyblocksstudio'
            printf '%s\n' '- Minimum Android version: API 24 / Android 7.0'
            printf '%s\n' '- Architectures: ARM64 and ARMv7'
            printf '%s\n' '- Build type: debug APK'
            printf '%s\n\n' "- Source commit: ${GITHUB_SHA}"
            printf '%s\n' 'This prerelease APK is suitable for direct testing and sideloading. Android may ask you to permit installation from the browser or file-manager app used to open it. It is not a production-signed Google Play package.'
          } > release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "checksum=${RELEASE_APK}.sha256" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_assets.outputs.tag }}
          APK: ${{ steps.release_assets.outputs.apk }}
          CHECKSUM: ${{ steps.release_assets.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PyBlocks Studio ${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PyBlocks Studio ${TAG}" \
              --notes-file release-notes.md \
              --prerelease
          fi
      - name: Upload short-lived workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pyblocks-studio-debug-apk
          path: |
            kivy_android/bin/PyBlocks-Studio-v*-debug.apk
            kivy_android/bin/PyBlocks-Studio-v*-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  record-result:
    if: always()
    needs: [validate, build-apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record machine-readable workflow result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build-apk.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' kivy_android/buildozer.spec | head -n 1 | tr -d '[:space:]')"
          TAG="v${VERSION}"
          RESULT="failure"
          if [[ "$VALIDATE_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]; then
            RESULT="success"
          fi

          mkdir -p release-status
          export VERSION TAG RESULT
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          data = {
              "version": os.environ["VERSION"],
              "tag": tag,
              "result": os.environ["RESULT"],
              "validation": os.environ["VALIDATE_RESULT"],
              "build": os.environ["BUILD_RESULT"],
              "source_commit": os.environ["SOURCE_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_attempt": int(os.environ["RUN_ATTEMPT"]),
              "recorded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow_url": f"https://github.com/{repo}/actions/runs/{os.environ['RUN_ID']}",
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "apk_url": f"https://github.com/{repo}/releases/download/{tag}/PyBlocks-Studio-{tag}-debug.apk",
          }
          Path(f"release-status/{tag}.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git add "release-status/${TAG}.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Android release ${TAG} result [skip ci]"
          git push origin HEAD:main
