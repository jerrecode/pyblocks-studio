name: Build and Release Kivy Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kivy_android/**"
      - ".github/workflows/kivy-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_PACKAGE_ID: org.jerrecode.pyblocksstudiopreview
  PREVIEW_CERT_SHA256: f380b4fd74574daa3a4f45abb5872fb6d48be95bf7aacdcfa867a41e0478f89b

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kivy_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run packaging preflight
        run: python scripts/preflight.py
      - name: Run semantic tests
        run: python -m unittest discover -s tests -v

  build-apk:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: kivy_android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint build-essential ccache cmake gettext git \
            libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libssl-dev libtool openjdk-17-jdk patch pkg-config \
            python3-dev python3-virtualenv unzip zip zlib1g-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer>=1.5,<2" "cython<3"
      - name: Install stable preview signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 --decode android-preview-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null
      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: buildozer -v android debug
      - name: Verify installability, manifest, ABI, and signature
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$SOURCE_APK"
          unzip -t "$SOURCE_APK" >/dev/null

          SDK_ROOT="$(find "$HOME/.buildozer" .buildozer -type d -path '*/android-sdk' -print -quit)"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK" | tee apksigner-report.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner-report.txt | head -n 1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test "$CERT_SHA256" = "$PREVIEW_CERT_SHA256"

          "$AAPT" dump badging "$SOURCE_APK" | tee aapt-badging.txt
          grep -Fq "package: name='${PREVIEW_PACKAGE_ID}'" aapt-badging.txt
          grep -Fq "native-code: 'arm64-v8a'" aapt-badging.txt
          if grep -Fq "native-code: 'armeabi-v7a'" aapt-badging.txt; then
            echo "Unexpected ARMv7 payload in ARM64 install-repair APK" >&2
            exit 1
          fi

          "$AAPT" dump permissions "$SOURCE_APK" | tee aapt-permissions.txt
          if grep -Fq "name='android.permission.'" aapt-permissions.txt; then
            echo "Malformed blank Android permission is still present" >&2
            exit 1
          fi

          "$ZIPALIGN" -c -P 16 -v 4 "$SOURCE_APK" >/dev/null

          echo "source_apk=$SOURCE_APK" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
      - name: Prepare versioned release assets
        id: release_assets
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' buildozer.spec | head -n 1 | tr -d '[:space:]')"
          test -n "$VERSION"
          TAG="v${VERSION}"
          SOURCE_APK="${{ steps.verify_apk.outputs.source_apk }}"
          test -f "$SOURCE_APK"

          RELEASE_APK="bin/PyBlocks-Studio-${TAG}-arm64-preview.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          (
            cd "$(dirname "$RELEASE_APK")"
            sha256sum "$(basename "$RELEASE_APK")"
          ) > "${RELEASE_APK}.sha256"

          {
            printf '## PyBlocks Studio %s\n\n' "$TAG"
            printf '%s\n\n' 'Android installation-repair preview of the native Kivy visual Python programming environment.'
            printf '%s\n' '- Package: org.jerrecode.pyblocksstudiopreview'
            printf '%s\n' '- Minimum Android version: API 24 / Android 7.0'
            printf '%s\n' '- Architecture: ARM64'
            printf '%s\n' '- Build type: debug-signed preview APK'
            printf '%s\n' '- Stable preview certificate SHA-256: f380b4fd74574daa3a4f45abb5872fb6d48be95bf7aacdcfa867a41e0478f89b'
            printf '%s\n\n' "- Source commit: ${GITHUB_SHA}"
            printf '%s\n' 'This build removes the malformed blank permission from v0.1.0 and uses a conflict-free package ID so it can be installed independently of any earlier PyBlocks Studio package.'
            printf '%s\n' 'This is a public test-key prerelease for direct sideloading, not a production-signed Google Play package.'
          } > release-notes.md

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "checksum=${RELEASE_APK}.sha256" >> "$GITHUB_OUTPUT"
      - name: Create or update GitHub prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_assets.outputs.tag }}
          APK: ${{ steps.release_assets.outputs.apk }}
          CHECKSUM: ${{ steps.release_assets.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "PyBlocks Studio ${TAG} Android install repair" \
              --notes-file release-notes.md \
              --prerelease
          else
            gh release create "$TAG" "$APK" "$CHECKSUM" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "PyBlocks Studio ${TAG} Android install repair" \
              --notes-file release-notes.md \
              --prerelease
          fi
      - name: Upload short-lived workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pyblocks-studio-v0.1.1-arm64-preview-apk
          path: |
            kivy_android/bin/PyBlocks-Studio-v*-arm64-preview.apk
            kivy_android/bin/PyBlocks-Studio-v*-arm64-preview.apk.sha256
          if-no-files-found: error
          retention-days: 14

  record-result:
    if: always()
    needs: [validate, build-apk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record machine-readable workflow result
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build-apk.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' kivy_android/buildozer.spec | head -n 1 | tr -d '[:space:]')"
          TAG="v${VERSION}"
          RESULT="failure"
          if [[ "$VALIDATE_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]; then
            RESULT="success"
          fi

          mkdir -p release-status
          export VERSION TAG RESULT
          python - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          data = {
              "version": os.environ["VERSION"],
              "tag": tag,
              "result": os.environ["RESULT"],
              "validation": os.environ["VALIDATE_RESULT"],
              "build": os.environ["BUILD_RESULT"],
              "source_commit": os.environ["SOURCE_SHA"],
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_attempt": int(os.environ["RUN_ATTEMPT"]),
              "recorded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "workflow_url": f"https://github.com/{repo}/actions/runs/{os.environ['RUN_ID']}",
              "release_url": f"https://github.com/{repo}/releases/tag/{tag}",
              "apk_url": f"https://github.com/{repo}/releases/download/{tag}/PyBlocks-Studio-{tag}-arm64-preview.apk",
          }
          Path(f"release-status/{tag}.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git add "release-status/${TAG}.json"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Android release ${TAG} result [skip ci]"
          git push origin HEAD:main
